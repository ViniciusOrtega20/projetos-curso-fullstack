<div class="rounded-2xl bg-[#ECF5FE] p-8 flex flex-col gap-7 sm:flex-row-reverse sm:justify-between sm:items-center">
  <div>
    <img ngSrc="/icons/icon-hand-coding.svg" alt="Welcome" height="112" width="112">
  </div>
  <div class="gap-4 flex flex-col">
    <div class="flex flex-col gap-0.5">
      <h2 class="text-2xl font-bold text-[#080B12]">Bem vinda de volta, <br>Jennie</h2>
      <h3 class="font-medium opacity-80 text-[#374151]">Não se esqueça de atualizar as tarefas</h3>
    </div>
    <div>
      <button type="button"
              class="bg-[#2A89EF] text-center flex items-center gap-2 py-3 px-4 rounded-xl cursor-pointer
              active:translate-y-0.5 transition-transform duration-75 hover:bg-[#1976D2]"
              (click)="openNewTaskModal()"
      >
        <img ngSrc="/icons/icon-plus-circle.svg" alt="Adicionar tarefa" height="20" width="20">
        <span class="text-white text-sm font-semibold">Criar uma tarefa</span>
      </button>
    </div>
  </div>
</div>
