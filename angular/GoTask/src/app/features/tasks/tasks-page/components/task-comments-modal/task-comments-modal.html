<div class="rounded-xl overflow-scroll bg-white max-h-[500] scrollbar-hidden">
  <div class="flex gap-1 items-center p-4">
    <img ngSrc="/icons/icon-task-star.svg" alt="Task Star" height="16" width="16" />
    <h1 class="font-semibold text-lg">Comentar Tarefa</h1>
    <button class="ml-auto cursor-pointer active:translate-y-0.5 transition-transform duration-75"
            (click)="closeModal()">
      <img ngSrc="/icons/icon-close.svg" alt="Close" height="10" width="10" />
    </button>
  </div>
  <div class="p-4 border-t border-[#D1D5DB]">
    <h1 class="font-semibold text-lg mb-4">{{ this._task.name }}</h1>
    <p class="font-semibold text-sm mb-2">Descrição</p>
    <p class="font-normal text-base text-[#374151]">{{ this._task.description }}</p>
  </div>
  <div class="p-4 ">
    <div class="bg-[#F3F4F6] p-5 rounded-xl flex flex-col gap-5">
      <div>
        <p class="font-bold text-sm">Comentário</p>
      </div>
      <div class="flex items-start gap-2">
        <div class="flex flex-col gap-2 w-full justify-center">
          <input
            #commentInput
            type="text" id="modal-task-input-comentario"
            class="rounded-xl border border-[#D1D5D8] p-3 bg-white flex-1 text-sm font-light"
            placeholder="Adicione um comentário"
            [formControl]="commentControl"
          />
        </div>
        <app-primary-button-form
          id="modal-task-button-adicionar-comentario"
          text="Adicionar"
          (click)="onAddComment()"
          [disabled]=commentControl.invalid
        />
      </div>
      <div id="modal-task-comentarios" class="max-h-60 overflow-scroll scrollbar-hidden">
        @for (taskComment of this._task.comments; track taskComment.id; let last = $last) {
          <app-comentario-modal
            id="{{taskComment.id}}"
            text="{{taskComment.description}}"
            time="{{taskComment.createdAt | date: 'dd/MM/yyyy HH:mm'}}"
            [lastItem]="last"
            (removeComment)="onRemoveComment($event)"
          />
        }
      </div>
    </div>
  </div>
</div>
