<div
  cdkDropList
  [id]="status() + '-column'"
  [cdkDropListData]="taskList()"
  class="mb-6 py-3 px-6 min-w-60 flex flex-col gap-6"
  (cdkDropListDropped)="onCardDrop($event)"
>
  <div class="py-2 border-b border-[#D1D5DB] flex items-center gap-1">
    <h1 class="font-bold">{{ titulo() }}</h1>
    <span class="text-xs font-semibold text-white px-2 rounded-xl"
          [style.background-color]="statusColor()"
    >
      {{ totalTarefas() }}
    </span>
  </div>
  <div class="flex flex-col gap-3" [class.min-h-20]="taskList().length === 0">
    @for (item of taskList(); track item.id) {
      <app-task-card
        cdkDrag
        [cdkDragData]="item"
        [task]="item"
      />
    }
  </div>
</div>
