<button
  [disabled]=disabled()
  class="py-3 px-4 rounded-xl text-sm font-semibold text-white
    bg-[#2A89EF]
    cursor-pointer transition-transform duration-75 shadow-md
    hover:bg-[#1976D2]
    active:translate-y-1

    disabled:opacity-50
    disabled:cursor-default
    disabled:bg-[#D7D8D8]
    disabled:shadow-none
    disabled:translate-y-0"
  id="{{ id() }}"
  type="submit"
>
  {{ text() }}
</button>
